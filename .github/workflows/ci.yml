name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the previous run irrelevant. Main is never cancelled:
# its runs are the record of what actually passed on the branch we deploy from.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"

jobs:
  # Types first and on its own: it is the fastest way to learn the tree is
  # broken, and it covers the app, the tests and the e2e specs — Playwright and
  # Vitest both transpile without checking, so nothing else would.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Unit and integration tests for every workspace that has any. The web
  # integration suite starts the real signaling server, so this is not purely
  # unit-level despite being the fast job.
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Coverage
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: web/coverage/
          retention-days: 3
          if-no-files-found: ignore

  # Proves the thing the README tells a human to run actually produces a
  # servable app, and hands the artifact to the e2e job so it is not rebuilt.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fail if the web app produced no bundle
        run: test -f web/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # The real product: two browsers, a real signaling server, real peer
  # connections, and an assertion that decoded frames arrive.
  e2e-web:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Keyed on the Playwright version so a bump fetches fresh browsers
      # instead of silently reusing incompatible ones.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - name: Install system deps for cached browser
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - run: npm run test:e2e:web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-web
          path: |
            e2e/.report/
            e2e/.results/
          retention-days: 3

  # The Electron host app. It lives on its own branch for now, so this job is
  # gated on the directory existing: it lights up by itself when desktop/ lands
  # rather than sitting red on main in the meantime.
  e2e-desktop:
    name: End-to-end (Electron host)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - name: Is the desktop app on this branch?
        id: check
        run: |
          if [ -f desktop/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::desktop/ is not on this branch — skipping the Electron end-to-end tests."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: steps.check.outputs.present == 'true'
      - name: Build the desktop renderer
        if: steps.check.outputs.present == 'true'
        run: npm run build -w @swiff/desktop

      - name: Resolve Playwright version
        if: steps.check.outputs.present == 'true'
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.check.outputs.present == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright system dependencies
        if: steps.check.outputs.present == 'true'
        run: npx playwright install-deps chromium

      # Electron needs a display, and getDisplayMedia needs that display to have
      # a real size — a 0x0 root window hands back a dead track.
      - name: Run Electron end-to-end tests under a virtual display
        if: steps.check.outputs.present == 'true'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run test:e2e:desktop

      - uses: actions/upload-artifact@v4
        if: failure() && steps.check.outputs.present == 'true'
        with:
          name: playwright-report-desktop
          path: |
            e2e/.report/
            e2e/.results/
          retention-days: 3

  # Builds something a human can actually download and run. Everything else
  # here proves the code is correct; this is the only job that produces the
  # product. Gated on desktop/ the same way the Electron tests are, so it
  # lights up by itself when the host app lands.
  #
  # The artifacts are unsigned: there is no Apple Developer ID or Windows
  # certificate yet, so macOS shows "unidentified developer" (right-click →
  # Open gets past it) and Windows shows a SmartScreen warning. Fine for
  # trying it on our own machines, not fine for handing to a renter.
  package-desktop:
    name: Package desktop app (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            target: --mac dmg --arm64 --x64
          - os: windows-latest
            label: Windows
            target: --win portable --x64
    steps:
      - uses: actions/checkout@v4
      - name: Is the desktop app on this branch?
        id: check
        shell: bash
        run: |
          if [ -f desktop/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::desktop/ is not on this branch — nothing to package."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: steps.check.outputs.present == 'true'

      - name: Build the renderer
        if: steps.check.outputs.present == 'true'
        run: npm run build -w @swiff/desktop

      - name: Package
        if: steps.check.outputs.present == 'true'
        working-directory: desktop
        # Targets are passed on the command line rather than baked into the
        # package.json script, which only knows how to build for Windows.
        # CSC_IDENTITY_AUTO_DISCOVERY stops electron-builder hunting for a
        # signing identity that does not exist and failing the build over it.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Fail if nothing installable came out
        if: steps.check.outputs.present == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          found=(desktop/release/*.dmg desktop/release/*.exe)
          if [ ${#found[@]} -eq 0 ]; then
            echo "electron-builder produced no installer" >&2
            ls -R desktop/release || true
            exit 1
          fi
          printf 'built: %s\n' "${found[@]}"

      # Installers are large. Keep them only for main and manual runs:
      # uploading one per PR push is what filled the artifact quota. PRs still
      # prove the packaging works; they just do not keep the result.
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.present == 'true' && github.event_name != 'pull_request'
        with:
          name: swiff-host-${{ matrix.label }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
          retention-days: 3
          if-no-files-found: error

  # One green check to require in branch protection, so adding a job later does
  # not silently stop gating merges.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [typecheck, test, build, e2e-web, e2e-desktop, package-desktop]
    steps:
      - name: Fail if anything upstream did not succeed
        run: |
          echo "typecheck:   ${{ needs.typecheck.result }}"
          echo "test:        ${{ needs.test.result }}"
          echo "build:       ${{ needs.build.result }}"
          echo "e2e-web:     ${{ needs.e2e-web.result }}"
          echo "e2e-desktop: ${{ needs.e2e-desktop.result }}"
          echo "package:     ${{ needs.package-desktop.result }}"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
