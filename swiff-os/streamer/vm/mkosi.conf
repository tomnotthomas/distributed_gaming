# The streamer's VM test image: not Swiff OS, only enough of it to run the
# streamer the way the image will. Ubuntu with GStreamer and PipeWire, a renter
# whose PipeWire carries a synthetic "gamescope" node and a test tone, the
# streamer's user and device rules from ../system, and a test agent that starts
# the streamer as swiff-hostd does. There is no GPU, so it encodes with x264.
#
# The real image (swiff-os/image) is built by its own stage; run-test.sh builds this one.

[Distribution]
Distribution=ubuntu
Release=noble
Repositories=main,universe

[Host]
# bootctl, ukify and systemd-repart come from a tools tree of the same release,
# not from whatever the build host has installed.
ToolsTree=default
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=noble
ToolsTreePackages=
        systemd-repart
        systemd-boot
