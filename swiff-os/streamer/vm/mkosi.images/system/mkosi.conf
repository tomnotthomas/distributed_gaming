# The test system: what the streamer needs, nothing of Swiff OS's lockdown.

[Config]
Dependencies=initrd

[Output]
Format=disk
Output=swiff-streamer-vmtest

[Content]
Initrds=%O/initrd
# run-test.sh stages the streamer, its helpers, Node and ../system here.
ExtraTrees=%O/stage
Bootable=yes
Bootloader=systemd-boot
# Named outright: the small initrd does no GPT root discovery.
KernelCommandLine=console=ttyS0 systemd.show_status=error root=PARTLABEL=root-x86-64 rw
Packages=
        linux-image-virtual
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        udev
        dbus
        kmod
        iproute2
        acl
        python3
        python3-gi
        gir1.2-gstreamer-1.0
        gir1.2-gst-plugins-base-1.0
        gstreamer1.0-tools
        gstreamer1.0-plugins-base
        gstreamer1.0-plugins-good
        gstreamer1.0-plugins-bad
        gstreamer1.0-plugins-ugly
        gstreamer1.0-pipewire
        pipewire
        pipewire-bin
        wireplumber

