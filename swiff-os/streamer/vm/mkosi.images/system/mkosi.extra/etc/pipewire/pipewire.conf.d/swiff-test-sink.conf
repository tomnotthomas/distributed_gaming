# The VM has no sound card: a null sink stands in for one, so the session has
# something to play to and the streamer a monitor to capture.
context.objects = [
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "swiff-test-sink"
          media.class      = Audio/Sink
          audio.position   = [ FL FR ]
          priority.session = 2000
      }
    }
]
