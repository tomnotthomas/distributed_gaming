# VM test build only: the games library's log on the serial console, so that
# vm/run-test.sh sees what promotion did at shutdown.
[Service]
StandardOutput=journal+console
StandardError=journal+console
# In the seal-fails-* phases sealing to the TPM fails for this service, for
# that boot only: selftest-seal-fails puts a systemd-creds that cannot encrypt
# first on its PATH.
Environment=PATH=/run/swiff-selftest/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
ExecStartPre=/usr/libexec/swiff/selftest-seal-fails
