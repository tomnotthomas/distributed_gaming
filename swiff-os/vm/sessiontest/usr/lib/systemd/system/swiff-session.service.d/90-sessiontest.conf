# VM session test build only. The VM has no GPU, so gamescope cannot run:
# sessiontest-session runs the image's Steam sign-in agent as steam/session
# does, with a test picture and tone in gamescope's place and stand-ins for
# Steam and the X tools the agent reads it through.
[Service]
ExecStart=
ExecStart=/usr/libexec/swiff/sessiontest-session
StandardOutput=journal+console
StandardError=journal+console
