# The initrd baked into the Swiff UKI. It only has to find the verity root by
# the root hash on the UKI command line, open it read-only and switch to it.
# mkosi's built-in default initrd cannot be used: its Debian/Ubuntu package
# list names TPM libraries without the t64 suffix that Ubuntu 26.04 uses.

[Output]
Format=cpio
Output=initrd

[Content]
Bootable=no
MakeInitrd=yes
CleanPackageMetadata=yes
Packages=
        systemd
        systemd-cryptsetup    # systemd-veritysetup and its generator
        udev
        kmod
        dmsetup
        util-linux
        # dlopen'ed by systemd-pcrextend for the enter-initrd PCR 11 measurement
        libtss2-esys-3.0.2-0t64
        libtss2-mu-4.0.1-0t64
        libtss2-rc0t64
        libtss2-tcti-device0t64

RemoveFiles=
        /usr/lib/systemd/catalog
        /etc/udev/hwdb.d
        /usr/lib/udev/hwdb.d
        /usr/share/locale/*
        /usr/lib/modules/*/vmlinuz*
        /usr/lib/modules/*/System.map
