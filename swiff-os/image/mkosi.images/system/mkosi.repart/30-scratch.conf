# Ephemeral scratch. Never formatted here: at every boot systemd-cryptsetup
# opens it with a fresh random key that is never stored and makes a new ext4
# filesystem on it (/etc/crypttab), so a reboot is a cryptographic erase.
# It holds /home (the renter's Steam data, and Steam's writes over its cached
# client) and the games overlay's upper layer when the library is read-only.
# A generic Linux type keeps systemd-gpt-auto-generator from mounting it.
[Partition]
Type=linux-generic
Label=swiff-scratch
SizeMinBytes=3440M
SizeMaxBytes=3440M
