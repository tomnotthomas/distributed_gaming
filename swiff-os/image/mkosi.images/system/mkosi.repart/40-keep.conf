# The keep: what must outlive a reboot without being secret, and what the
# owner's app hands rental mode. Never formatted here. The owner's app writes
# its provisioning record (server, machine id, machine key) raw at its start
# when it installs Lanterel OS and each time it restarts the PC into it;
# swiff-provision seals that record to this PC's TPM, formats the keep as ext4
# and keeps the sealed record there, beside the TPM-sealed U share of the
# state's key (swiff-hostd). A generic Linux type keeps
# systemd-gpt-auto-generator from mounting it.
[Partition]
Type=linux-generic
Label=swiff-keep
# Empty: nothing to write out as a split artifact.
SplitName=-
SizeMinBytes=16M
SizeMaxBytes=16M
