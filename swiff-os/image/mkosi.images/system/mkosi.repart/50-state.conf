# The persistent state: LUKS2 under U XOR V, formatted and opened by
# swiff-hostd once the server releases V to an attested boot (README,
# swiff-hostd). It holds the agent's own state and the cached Steam client.
# Never formatted here. A generic Linux type keeps systemd-gpt-auto-generator
# from mounting it.
[Partition]
Type=linux-generic
Label=swiff-state
# Empty: nothing to write out as a split artifact.
SplitName=-
SizeMinBytes=3072M
SizeMaxBytes=3072M
