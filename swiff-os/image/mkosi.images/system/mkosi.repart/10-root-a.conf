# Slot A: the root filesystem this image boots. It is read-only erofs under
# dm-verity; the UKI command line carries the root hash, and systemd finds
# this partition and its hash partition by UUIDs derived from that hash.
# The label follows systemd-sysupdate's <id>_<version> pattern.
[Partition]
Type=root
Format=erofs
CopyFiles=/
Verity=data
VerityMatchKey=root
Label=swiffos_%A
SizeMinBytes=8G
SizeMaxBytes=8G
