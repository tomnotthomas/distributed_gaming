# Slot B: an empty slot of the same size for the next image version. An
# update writes the new root and hash here and a new UKI pointing at them;
# slot A stays bootable until the new one has booted well.
[Partition]
Type=root
Label=_empty
# Empty: nothing to write out as a split artifact.
SplitName=-
SizeMinBytes=8G
SizeMaxBytes=8G
