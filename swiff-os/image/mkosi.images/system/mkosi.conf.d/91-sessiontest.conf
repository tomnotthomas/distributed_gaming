# VM session test build (vm/session-test.sh passes --profile=sessiontest). Adds
# what stands in for the owner's app, a GPU and a Steam account (vm/sessiontest/)
# and a serial console, and writes swiffos-sessiontest.raw next to the shipped
# image; everything else is the shipped image's configuration.
[Match]
Profile=sessiontest

[Output]
Output=swiffos-sessiontest

[Content]
ExtraTrees=../../../vm/sessiontest
KernelCommandLine=console=ttyS0
