# VM Wi-Fi test build (vm/wifi-test.sh passes --profile=wifitest). Adds a
# simulated Wi-Fi access point (vm/wifitest/: mac80211_hwsim radios, hostapd
# and dnsmasq in a network namespace of their own) and a serial console, and
# writes swiffos-wifitest.raw next to the shipped image; everything else is the
# shipped image's configuration. Its packages differ from the other builds',
# so vm/build-image.sh keeps its package cache apart.
[Match]
Profile=wifitest

[Output]
Output=swiffos-wifitest

[Content]
ExtraTrees=../../../vm/wifitest
KernelCommandLine=console=ttyS0
Packages=
        hostapd
        dnsmasq-base
        iw
