# VM test build (vm/run-test.sh passes --profile=selftest). Adds the self-test
# service and a serial console and writes swiffos-selftest.raw next to the
# shipped image; everything else is the shipped image's configuration.
[Match]
Profile=selftest

[Output]
Output=swiffos-selftest

[Content]
ExtraTrees=../../../vm/selftest
KernelCommandLine=console=ttyS0
