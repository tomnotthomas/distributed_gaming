# Report §5.2 hardening that is not on the kernel command line.
kernel.yama.ptrace_scope = 3
kernel.kexec_load_disabled = 1
kernel.sysrq = 0
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
dev.tty.ldisc_autoload = 0
# No core dumps, of the renter's programs or of a root daemon: a process's
# memory (a session key, the Wi-Fi passphrase iwd holds) never lands in a file.
# Debian's 10-coredump-debian.conf writes them to "core" in the working directory.
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0
