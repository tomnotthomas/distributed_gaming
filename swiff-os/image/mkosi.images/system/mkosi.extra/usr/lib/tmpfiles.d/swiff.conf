d /home/renter          0700 renter renter -
d /home/.swiff          0700 root   root   -
d /home/.swiff/games    0700 root   root   -
# The Steam sign-in agent's socket (login.sock, mode 660): the renter's, and
# the streamer's group may reach it. New files take the directory's group.
d /run/swiff/steam      2750 renter swiff-stream -
# swiff-hostd's config, machine key and state directory: root's alone.
d /var/lib/swiff        0700 root   root   -
