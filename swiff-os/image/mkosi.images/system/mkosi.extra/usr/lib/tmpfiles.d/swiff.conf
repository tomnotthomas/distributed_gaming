d /home/renter          0700 renter renter -
d /home/.swiff          0700 root   root   -
d /home/.swiff/games    0700 root   root   -
d /run/swiff            0755 root   root   -
# The Steam sign-in agent's socket (login.sock, mode 660): the renter's, and
# the streamer's group may reach it. New files take the directory's group.
d /run/swiff/steam      2750 renter swiff-stream -
# How keeping the Steam client went in this boot (steam/client).
d /run/swiff/steam-client 0755 root root -
# swiff-hostd's config and machine key for this boot, and where the keep and
# the persistent state are mounted: root's alone.
d /var/lib/swiff        0700 root   root   -
d /var/lib/swiff/keep   0700 root   root   -
d /var/lib/swiff/state  0700 root   root   -
