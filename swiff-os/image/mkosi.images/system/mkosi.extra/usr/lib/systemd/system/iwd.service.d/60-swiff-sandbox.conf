# iwd holds the owner's Wi-Fi passphrase in memory, so it runs boxed in beyond
# Ubuntu's unit (which already has ProtectSystem=strict, ProtectHome=,
# PrivateTmp=, NoNewPrivileges= and only CAP_NET_ADMIN, CAP_NET_RAW and
# CAP_NET_BIND_SERVICE).
[Service]
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
MemoryDenyWriteExecute=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
SystemCallArchitectures=native
