# NVIDIA cards run on NVIDIA's driver, which the owner installs
# (swiff-os/NVIDIA.md), never on nouveau or nova.
blacklist nouveau
blacklist nova
blacklist nova_core
alias nouveau off
alias nova off
alias nova_core off
# nvidia.ko is in the image, but its GSP firmware comes with the owner's
# driver: udev must not load it for the card before swiff-nvidia.service has
# checked and merged that driver. The service loads it by name.
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm
# gamescope needs nvidia-drm's kernel modesetting.
options nvidia_drm modeset=1
