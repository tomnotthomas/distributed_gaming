# Swiff rental-mode policy: provisional defaults for two captain decisions
# that are still open. This file is the one place to change them.

# D3, hardware floor: what a PC must have to be offered in rental mode.
# Items: uefi secureboot tpm2 tpm2-ekcert iommu.
SWIFF_HARDWARE_FLOOR="uefi secureboot tpm2 tpm2-ekcert iommu"
# Discrete (bus-attached) TPMs: "lower-tier" accepts them at a lower trust
# tier, "refuse" accepts only firmware TPMs (fTPM/PTT).
SWIFF_DISCRETE_TPM=lower-tier

# D8, owner takeover while sharing: "idle" offers "Return to Windows" only
# when no session is live; "always" offers it at any time.
SWIFF_OWNER_TAKEOVER=idle
