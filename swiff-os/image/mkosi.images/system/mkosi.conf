# The Swiff OS system image: a dm-verity, read-only root in an A/B slot pair,
# booted from a signed UKI by systemd-boot.

[Config]
Dependencies=initrd

[Output]
Format=disk
Output=swiffos
ImageVersion=0.1.0
# Writes each partition and the UKI out as separate files too, which is what a
# future A/B update (systemd-sysupdate, report stage 5) installs into slot B.
SplitArtifacts=yes
ManifestFormat=json

[Content]
Bootable=yes
Bootloader=systemd-boot
Initrds=%O/initrd
# All of the initrd's kernel modules are cut except what is needed to reach
# the root: disks, device-mapper (verity, crypt), the root and ESP filesystems
# and the TPM. Every other module loads from the verity root later.
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=
        drivers/nvme/
        drivers/ata/
        drivers/scsi/
        drivers/block/virtio_blk
        drivers/virtio/
        drivers/md/
        drivers/char/tpm/
        fs/erofs/
        fs/ext4/
        fs/fat/
        fs/nls/
        crypto/

# The kernel command line is part of the signed UKI and measured into PCR 12;
# systemd-stub ignores any command line the boot loader passes while Secure
# Boot is on. The verity root hash (roothash=) is added by mkosi.
KernelCommandLine=
        ro
        systemd.volatile=state
        systemd.firstboot=no
        systemd.import_credentials=no
        lockdown=confidentiality
        module.sig_enforce=1
        iommu=force
        iommu.strict=1
        iommu.passthrough=0
        intel_iommu=on
        amd_iommu=force_isolation
        nohibernate
        sysrq_always_enabled=0
        modprobe.blacklist=usb_storage,uas

Packages=
        linux-image-generic
        systemd
        systemd-boot-efi
        systemd-cryptsetup
        dmsetup               # udev rules libdevmapper waits on when opening the scratch
        systemd-resolved
        systemd-timesyncd
        libpam-systemd
        dbus
        dbus-user-session
        udev
        kmod
        e2fsprogs
        iproute2
        nftables
        ca-certificates
        # TPM2 libraries, dlopen'ed by systemd for PCR phase measurements
        libtss2-esys-3.0.2-0t64
        libtss2-mu-4.0.1-0t64
        libtss2-rc0t64
        libtss2-tcti-device0t64
        # The renter session: gamescope is the only compositor and the only UI
        gamescope
        xwayland
        mesa-vulkan-drivers
        libgl1-mesa-dri
        # Needed by the Steam launcher; Steam itself is installed by
        # mkosi.postinst.chroot because it needs i386 multiarch.
        apt
        debconf
        xdg-user-dirs
        zenity
        lsof
        # swiff-verify (the games library): Python, AES for Steam's encrypted
        # manifest file names
        python3
        python3-cryptography

RemoveFiles=
        /usr/share/locale/*
        /usr/share/man/*
        /usr/share/doc/*

[Validation]
# Signs systemd-boot and the UKI with the key in ../../mkosi.conf. In the VM,
# systemd-boot enrols the matching certificate as PK, KEK and db on first boot
# while the firmware is in setup mode (SecureBootAutoEnroll).
SecureBoot=yes
SecureBootAutoEnroll=yes
