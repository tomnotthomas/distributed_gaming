# The Swiff OS system image: a dm-verity, read-only root in an A/B slot pair,
# booted from a signed UKI by systemd-boot.

[Config]
Dependencies=initrd

[Output]
Format=disk
Output=swiffos
ImageVersion=0.1.0
# Writes each partition and the UKI out as separate files too, which is what a
# future A/B update (systemd-sysupdate, report stage 5) installs into slot B.
SplitArtifacts=yes
ManifestFormat=json

[Content]
Bootable=yes
Bootloader=systemd-boot
Initrds=%O/initrd
# All of the initrd's kernel modules are cut except what is needed to reach
# the root: disks, device-mapper (verity, crypt), the root and ESP filesystems
# and the TPM. Every other module loads from the verity root later.
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=
        drivers/nvme/
        drivers/ata/
        drivers/scsi/
        drivers/block/virtio_blk
        drivers/virtio/
        drivers/md/
        drivers/char/tpm/
        fs/erofs/
        fs/ext4/
        fs/fat/
        fs/nls/
        crypto/

# The kernel command line is part of the signed UKI and measured into PCR 12;
# systemd-stub ignores any command line the boot loader passes while Secure
# Boot is on. The verity root hash (roothash=) is added by mkosi.
KernelCommandLine=
        ro
        systemd.volatile=state
        systemd.firstboot=no
        systemd.import_credentials=no
        lockdown=confidentiality
        module.sig_enforce=1
        iommu=force
        iommu.strict=1
        iommu.passthrough=0
        intel_iommu=on
        amd_iommu=force_isolation
        nohibernate
        sysrq_always_enabled=0
        modprobe.blacklist=usb_storage,uas

Packages=
        linux-image-generic
        systemd
        systemd-boot-efi
        systemd-cryptsetup
        dmsetup               # udev rules libdevmapper waits on when opening the scratch
        systemd-resolved
        systemd-timesyncd
        libpam-systemd
        dbus
        dbus-user-session
        udev
        kmod
        e2fsprogs
        iproute2
        nftables
        ca-certificates
        # TPM2 libraries, dlopen'ed by systemd for PCR phase measurements
        libtss2-esys-3.0.2-0t64
        libtss2-mu-4.0.1-0t64
        libtss2-rc0t64
        libtss2-tcti-device0t64
        # The renter session: gamescope is the only compositor and the only UI
        gamescope
        xwayland
        mesa-vulkan-drivers
        libgl1-mesa-dri
        # Needed by the Steam launcher; Steam itself is installed by
        # mkosi.postinst.chroot because it needs i386 multiarch.
        apt
        debconf
        xdg-user-dirs
        zenity
        lsof
        curl                  # the launcher downloads Valve's bootstrap with it
        xz-utils              # and unpacks it
        # The Steam client kept on the persistent state across reboots (steam/client)
        rsync
        # swiff-verify (the games library): Python, AES for Steam's encrypted
        # manifest file names
        python3
        python3-cryptography
        # swiff-hostd, swiff-streamer and the Steam sign-in agent run on Node 22
        # from the same snapshot, each as one bundled file (../../stage.sh):
        # Ubuntu's Node is built without TypeScript type stripping.
        nodejs
        # swiff-hostd: the persistent state's LUKS2 partition, and the way
        # back to Windows (Windows Boot Manager first in BootOrder)
        cryptsetup-bin
        efibootmgr
        # The renter's PipeWire, which gamescope streams its picture into and
        # the game's sound plays through, whatever audio API it uses
        pipewire
        pipewire-pulse
        pipewire-alsa
        wireplumber
        acl                   # swiff-pipewire-grant lets the streamer's user in
        # swiff-streamer's capture helpers: H.264 on the GPU through VA-API
        # (AMD through Mesa, Intel through its media driver; NVIDIA's NVENC
        # stays out with NVIDIA's driver) or x264 without one, Opus, RTP
        python3-gi
        gir1.2-gstreamer-1.0
        gir1.2-gst-plugins-base-1.0
        gstreamer1.0-pipewire
        gstreamer1.0-plugins-base
        gstreamer1.0-plugins-good
        gstreamer1.0-plugins-bad
        gstreamer1.0-plugins-ugly
        intel-media-va-driver
        # The Steam sign-in agent reads Steam's QR code off the screen
        x11-utils             # xwininfo, xprop
        x11-apps              # xwd
        zbar-tools            # zbarimg

# swiff-hostd, swiff-streamer, the Steam sign-in agent and the renter session,
# from the rest of the repository: ../../stage.sh writes them into the output
# directory before the build.
ExtraTrees=%O/stage

RemoveFiles=
        /usr/share/locale/*
        /usr/share/man/*
        /usr/share/doc/*
        # The package lists mkosi.postinst.chroot fetched (250 MB): /var is a
        # tmpfs at runtime, so they would never be seen. systemd-repart makes
        # the root's erofs in a tmpfs half the build machine's RAM, and needs
        # about twice the root's size there.
        /var/lib/apt/lists/*

[Validation]
# Signs systemd-boot and the UKI with the key in ../../mkosi.conf. In the VM,
# systemd-boot enrols the matching certificate as PK, KEK and db on first boot
# while the firmware is in setup mode (SecureBootAutoEnroll).
SecureBoot=yes
SecureBootAutoEnroll=yes
