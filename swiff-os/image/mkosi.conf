# Swiff OS: the locked rental-mode image for host PCs. Settings here apply to
# every image in mkosi.images/ (the initrd and the system image).

[Distribution]
Distribution=ubuntu
Release=resolute
Architecture=x86-64
Repositories=universe,multiverse
# A dated snapshot of the archive, so the same tree builds the same packages.
# Bump the timestamp to take updates. The -security pocket is not mirrored by
# mkosi 20 and still comes from security.ubuntu.com.
Mirror=https://snapshot.ubuntu.com/ubuntu/20261001T000000Z

[Output]
ImageId=swiffos
# No OutputDirectory= or CacheDirectory= here: the build runs as root and
# leaves root-only directories behind, which must stay out of the source tree
# (prettier and other tree walkers fail on them). vm/run-test.sh passes
# --output-dir and --cache-dir under ~/.cache/swiff-os.
# Fixed partition UUIDs and metadata seed, for reproducible disk images.
Seed=5f1a7c3e-0b6d-4e2a-9c1f-3d8b7a6e5c40

[Content]
SourceDateEpoch=1790812800
WithDocs=no
Locale=C.UTF-8
Timezone=UTC
# The renter's Steam client is fetched by apt inside the image (i386 multiarch),
# which needs the network during the post-install script.
WithNetwork=yes

[Validation]
# Test keys from `mkosi genkey`, never committed. Production keys live in an
# HSM (report §5, stage 5).
SecureBootKey=mkosi.key
SecureBootCertificate=mkosi.crt
# Signs the UKI's expected PCR 11 values with the same key, into its .pcrsig and
# .pcrpkey sections: the policy swiff-hostd seals the state's U share under.
SignExpectedPcr=yes

[Host]
# sbsign, ukify, systemd-repart and erofs-utils come from a tools tree of the
# same Ubuntu release, not from whatever the build host has installed.
ToolsTree=default
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=resolute
ToolsTreeMirror=https://snapshot.ubuntu.com/ubuntu/20261001T000000Z
# Not in mkosi 20's default tools tree list for Ubuntu, where systemd-repart
# is packaged separately from systemd.
ToolsTreePackages=
        systemd-repart
        libcryptsetup12  # dlopen'ed by systemd-repart for Verity=
# Caches each image's tree after package installation, so rebuilding after a
# change to the extra trees or scripts takes minutes, not a full install.
Incremental=yes
